<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学计算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>

        <div class="mode-toggle">
            <button id="angle-mode" class="mode-btn">角度 (DEG)</button>
        </div>

        <div class="buttons">
            <!-- 科学功能区 -->
            <div class="scientific-panel">
                <button class="btn sci" data-action="sin">sin</button>
                <button class="btn sci" data-action="cos">cos</button>
                <button class="btn sci" data-action="tan">tan</button>
                <button class="btn sci" data-action="asin">asin</button>
                <button class="btn sci" data-action="acos">acos</button>
                <button class="btn sci" data-action="atan">atan</button>
                <button class="btn sci" data-action="sqrt">√</button>
                <button class="btn sci" data-action="square">x²</button>
                <button class="btn sci" data-action="cube">x³</button>
                <button class="btn sci" data-action="power">xⁿ</button>
                <button class="btn sci" data-action="inverse">1/x</button>
                <button class="btn sci" data-action="factorial">n!</button>
                <button class="btn sci" data-action="log">log</button>
                <button class="btn sci" data-action="ln">ln</button>
                <button class="btn sci" data-action="exp">eˣ</button>
                <button class="btn sci" data-action="pi">π</button>
                <button class="btn sci" data-action="e">e</button>
                <button class="btn sci" data-action="percent">%</button>
            </div>

            <!-- 基础功能区 -->
            <div class="basic-panel">
                <button class="btn func" data-action="clear">AC</button>
                <button class="btn func" data-action="backspace">⌫</button>
                <button class="btn func" data-action="negate">±</button>
                <button class="btn op" data-action="divide">÷</button>
                <button class="btn num" data-value="7">7</button>
                <button class="btn num" data-value="8">8</button>
                <button class="btn num" data-value="9">9</button>
                <button class="btn op" data-action="multiply">×</button>
                <button class="btn num" data-value="4">4</button>
                <button class="btn num" data-value="5">5</button>
                <button class="btn num" data-value="6">6</button>
                <button class="btn op" data-action="subtract">−</button>
                <button class="btn num" data-value="1">1</button>
                <button class="btn num" data-value="2">2</button>
                <button class="btn num" data-value="3">3</button>
                <button class="btn op" data-action="add">+</button>
                <button class="btn num zero" data-value="0">0</button>
                <button class="btn num" data-value=".">.</button>
                <button class="btn equals" data-action="equals">=</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
